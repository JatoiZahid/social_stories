<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Stories Admin</title>
<style>
  :root {
    --bg: #f6f4fb; --card: #ffffff; --ink: #2a2540; --ink-soft: #6c6688;
    --primary: #6b4fd8; --primary-ink: #ffffff; --border: #e3def3; --tint: #efeafd;
    --danger: #c53b3b; --ok: #2e8b57; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17151f; --card: #221f2e; --ink: #ece9f7; --ink-soft: #a8a2c2;
      --primary: #9a85f0; --primary-ink: #17151f; --border: #363149; --tint: #2b2740;
      --danger: #ef7171; --ok: #6cc596;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--card); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  button, .button { font: inherit; border: 1px solid var(--border); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  button:hover, .button:hover { border-color: var(--primary); }
  button.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); font-weight: 600; }
  button.danger { color: var(--danger); }
  button.icon { padding: 5px 9px; }
  button:disabled { opacity: .45; cursor: default; }
  input, textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; width: 100%; }
  textarea { resize: vertical; min-height: 54px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-soft); margin: 10px 0 4px; }
  main { display: grid; grid-template-columns: 290px 1fr; gap: 20px; padding: 20px; max-width: 1300px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 16px; } }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .story-list { list-style: none; margin: 10px 0 0; padding: 0; }
  .story-list li { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 10px; cursor: pointer; }
  .story-list li:hover { background: var(--tint); }
  .story-list li.active { background: var(--tint); outline: 2px solid var(--primary); }
  .story-list img { width: 46px; height: 36px; object-fit: cover; border-radius: 6px; background: var(--tint); flex: none; }
  .story-list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .story-list .moves { display: flex; gap: 2px; }
  .story-list .moves button { padding: 1px 6px; font-size: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .muted { color: var(--ink-soft); font-size: 13px; }
  .pages { display: grid; gap: 14px; margin-top: 14px; }
  .page { display: grid; grid-template-columns: 260px 1fr; gap: 14px; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  @media (max-width: 640px) { .page { grid-template-columns: 1fr; } }
  .preview { position: relative; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 12px; background: var(--tint); }
  .preview img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .page-head { display: flex; align-items: center; gap: 6px; }
  .page-head strong { flex: 1; }
  .sliders { display: grid; grid-template-columns: auto 1fr 3.2em; gap: 4px 8px; align-items: center; font-size: 13px; margin-top: 8px; }
  .sliders input { padding: 0; }
  .empty { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .dirty { color: var(--danger); font-size: 13px; font-weight: 600; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); z-index: 10; }
  #toast.show { opacity: 1; }
  #toast.error { background: var(--danger); color: #fff; }
  .login { max-width: 380px; margin: 12vh auto; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<section id="login" class="panel login hidden">
  <h2 style="margin-top:0">Social Stories Admin</h2>
  <p class="muted">Enter the admin token. It is shown in the server window when the server starts (and saved in <code>server/data/admin_token.txt</code>).</p>
  <form id="login-form">
    <label for="token">Admin token</label>
    <input id="token" type="password" autocomplete="current-password" required>
    <div class="row" style="margin-top:14px"><button class="primary" type="submit">Sign in</button></div>
  </form>
</section>

<div id="app" class="hidden">
  <header>
    <h1>Social Stories Admin</h1>
    <span class="muted" id="count"></span>
    <button id="logout">Sign out</button>
  </header>
  <main>
    <aside class="panel">
      <div class="row">
        <strong class="grow">Stories</strong>
        <button class="primary" id="new-story">+ New story</button>
      </div>
      <p class="muted" style="margin:6px 0 0">The app shows them in this order. Use the arrows to move a story.</p>
      <ul class="story-list" id="story-list"></ul>
    </aside>
    <section class="panel" id="editor">
      <div class="empty">Pick a story on the left, or create a new one.</div>
    </section>
  </main>
</div>

<input type="file" id="file-input" accept="image/png,image/jpeg,image/webp" class="hidden">
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  // ── State ──────────────────────────────────────────────────────────────
  let token = '';
  try { token = localStorage.getItem('adminToken') || ''; } catch (_) {}
  let stories = [];
  let images = [];
  let draft = null;        // story being edited (a copy)
  let draftIsNew = false;
  let dirty = false;

  const $ = (id) => document.getElementById(id);

  // ── Helpers ────────────────────────────────────────────────────────────
  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (key === 'class') node.className = value;
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else if (key in node) node[key] = value;
      else node.setAttribute(key, value);
    }
    for (const child of children.flat()) {
      if (child != null) node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }

  let toastTimer;
  function toast(message, isError = false) {
    const t = $('toast');
    t.textContent = message;
    t.className = 'show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.className = ''), isError ? 5000 : 2500);
  }

  async function api(method, path, body, contentType = 'application/json') {
    const headers = {};
    if (token) headers.authorization = 'Bearer ' + token;
    if (body !== undefined) headers['content-type'] = contentType;
    const res = await fetch(path, {
      method,
      headers,
      body: body === undefined ? undefined : contentType === 'application/json' ? JSON.stringify(body) : body,
    });
    if (res.status === 401) { showLogin('Your token was not accepted. Please sign in again.'); throw new Error('Not signed in.'); }
    if (res.status === 204) return null;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
    return data;
  }

  const imageUrl = (path) => '/' + path;
  const clone = (v) => JSON.parse(JSON.stringify(v));
  const slug = (text) => text.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 64);

  function setDirty(value) {
    dirty = value;
    const flag = $('dirty-flag');
    if (flag) flag.classList.toggle('hidden', !dirty);
    const save = $('save');
    if (save) save.disabled = !dirty;
  }

  function confirmDiscard() {
    return !dirty || confirm('You have unsaved changes. Discard them?');
  }

  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  // ── Login ──────────────────────────────────────────────────────────────
  function showLogin(message) {
    $('app').classList.add('hidden');
    $('login').classList.remove('hidden');
    if (message) toast(message, true);
    $('token').focus();
  }

  $('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    token = $('token').value.trim();
    try {
      await api('GET', '/api/auth');
      try { localStorage.setItem('adminToken', token); } catch (_) {}
      start();
    } catch (err) { /* showLogin already reported it */ }
  });

  $('logout').addEventListener('click', () => {
    if (!confirmDiscard()) return;
    token = '';
    try { localStorage.removeItem('adminToken'); } catch (_) {}
    setDirty(false);
    showLogin();
  });

  // ── Loading ────────────────────────────────────────────────────────────
  async function start() {
    try {
      await api('GET', '/api/auth');
    } catch (_) { return; }
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    await Promise.all([loadStories(), loadImages()]);
  }

  async function loadStories() {
    const data = await api('GET', '/api/stories');
    stories = data.stories;
    renderList();
  }

  async function loadImages() {
    images = (await api('GET', '/api/images')).images;
  }

  // ── Story list ─────────────────────────────────────────────────────────
  function renderList() {
    $('count').textContent = stories.length + (stories.length === 1 ? ' story' : ' stories');
    const list = $('story-list');
    list.replaceChildren(...stories.map((story, index) => el('li', {
      class: draft && !draftIsNew && draft.id === story.id ? 'active' : '',
      onclick: () => openStory(story.id),
    },
      el('img', { src: imageUrl(story.pages[0].image), alt: '' }),
      el('span', { class: 'name', title: story.title }, story.title),
      el('span', { class: 'moves' },
        el('button', { title: 'Move up', disabled: index === 0, onclick: (e) => { e.stopPropagation(); moveStory(index, -1); } }, '▲'),
        el('button', { title: 'Move down', disabled: index === stories.length - 1, onclick: (e) => { e.stopPropagation(); moveStory(index, 1); } }, '▼'),
      ),
    )));
  }

  async function moveStory(index, delta) {
    const ids = stories.map((s) => s.id);
    const [id] = ids.splice(index, 1);
    ids.splice(index + delta, 0, id);
    try {
      stories = (await api('PUT', '/api/order', { ids })).stories;
      renderList();
    } catch (err) { toast(err.message, true); }
  }

  function openStory(id) {
    if (!confirmDiscard()) return;
    const story = stories.find((s) => s.id === id);
    if (!story) return;
    draft = clone(story);
    draftIsNew = false;
    setDirty(false);
    renderEditor();
    renderList();
  }

  $('new-story').addEventListener('click', () => {
    if (!confirmDiscard()) return;
    const first = images[0] ? images[0].path : 'assets/images/stories/going_to_school.png';
    draft = { id: '', title: '', pages: [{ image: first, lead: '', body: '' }] };
    draftIsNew = true;
    renderEditor();
    renderList();
    setDirty(true);
    $('title').focus();
  });

  // ── Editor ─────────────────────────────────────────────────────────────
  function renderEditor() {
    const editor = $('editor');
    if (!draft) {
      editor.replaceChildren(el('div', { class: 'empty' }, 'Pick a story on the left, or create a new one.'));
      return;
    }
    let idTouched = !draftIsNew;

    const idInput = el('input', {
      id: 'story-id', value: draft.id, disabled: !draftIsNew, placeholder: 'e.g. getting_a_haircut',
      oninput: (e) => { idTouched = true; draft.id = e.target.value.trim(); setDirty(true); },
    });
    const titleInput = el('input', {
      id: 'title', value: draft.title, placeholder: 'e.g. Getting a Haircut', maxLength: 120,
      oninput: (e) => {
        draft.title = e.target.value;
        if (draftIsNew && !idTouched) { draft.id = slug(draft.title); idInput.value = draft.id; }
        setDirty(true);
      },
    });

    editor.replaceChildren(
      el('div', { class: 'row' },
        el('h2', { style: 'margin:0', class: 'grow' }, draftIsNew ? 'New story' : 'Edit story'),
        el('span', { id: 'dirty-flag', class: 'dirty hidden' }, 'Unsaved changes'),
        draftIsNew ? null : el('button', { class: 'danger', onclick: deleteStory }, 'Delete'),
        el('button', { onclick: revert }, draftIsNew ? 'Cancel' : 'Revert'),
        el('button', { id: 'save', class: 'primary', onclick: save, disabled: !dirty }, 'Save'),
      ),
      el('div', { class: 'row', style: 'align-items:flex-start' },
        el('div', { class: 'grow' }, el('label', { htmlFor: 'title' }, 'Title'), titleInput),
        el('div', { class: 'grow' },
          el('label', { htmlFor: 'story-id' }, 'Story id'),
          idInput,
        ),
      ),
      el('p', { class: 'muted', style: 'margin:6px 0 0' },
        draftIsNew ? 'The id is permanent: lowercase letters, numbers, "-" and "_".' : 'The id cannot change after a story is created.'),
      el('div', { class: 'pages', id: 'pages' }),
      el('div', { class: 'row', style: 'margin-top:14px' },
        el('button', { onclick: () => addPage(draft.pages.length - 1) }, '+ Add page'),
      ),
    );
    renderPages();
    setDirty(dirty);
  }

  function renderPages() {
    $('pages').replaceChildren(...draft.pages.map((page, i) => renderPage(page, i)));
  }

  function renderPage(page, index) {
    const focus = page.focus || { x: 0, y: 0, zoom: 1 };
    const img = el('img', { alt: '' });
    const applyFrame = () => {
      const f = page.focus || { x: 0, y: 0, zoom: 1 };
      const pos = ((f.x + 1) * 50) + '% ' + ((f.y + 1) * 50) + '%';
      img.src = imageUrl(page.image);
      img.style.objectPosition = pos;
      img.style.transformOrigin = pos;
      img.style.transform = 'scale(' + f.zoom + ')';
    };

    const setFocus = (key, value) => {
      const f = Object.assign({ x: 0, y: 0, zoom: 1 }, page.focus, { [key]: value });
      page.focus = (f.x === 0 && f.y === 0 && f.zoom === 1) ? undefined : f;
      applyFrame();
      setDirty(true);
    };

    const slider = (key, label, min, max, step) => {
      const out = el('span', {}, (focus[key] ?? 0).toFixed(2));
      const input = el('input', {
        type: 'range', min, max, step, value: focus[key],
        oninput: (e) => { const v = Number(e.target.value); out.textContent = v.toFixed(2); setFocus(key, v); },
      });
      return [el('span', {}, label), input, out];
    };

    const known = images.some((im) => im.path === page.image);
    const select = el('select', {
      onchange: (e) => {
        if (e.target.value === '__upload') { e.target.value = page.image; return upload(page, () => renderPages()); }
        page.image = e.target.value; applyFrame(); setDirty(true);
      },
    },
      known ? null : el('option', { value: page.image }, page.image),
      images.map((im) => el('option', { value: im.path, selected: im.path === page.image },
        im.name + (im.source === 'uploaded' ? ' (uploaded)' : ''))),
      el('option', { value: '__upload' }, 'Upload a new picture…'),
    );

    applyFrame();
    const last = draft.pages.length - 1;
    return el('div', { class: 'page' },
      el('div', {},
        el('div', { class: 'preview' }, img),
        el('label', {}, 'Picture'),
        select,
        el('div', { class: 'sliders' },
          slider('zoom', 'Zoom', 1, 3, 0.05),
          slider('x', 'Left / right', -1, 1, 0.05),
          slider('y', 'Up / down', -1, 1, 0.05),
        ),
        el('div', { class: 'row', style: 'margin-top:6px' },
          el('button', { class: 'icon', onclick: () => { page.focus = undefined; setDirty(true); renderPages(); } }, 'Show whole picture'),
        ),
      ),
      el('div', {},
        el('div', { class: 'page-head' },
          el('strong', {}, 'Page ' + (index + 1)),
          el('button', { class: 'icon', title: 'Move up', disabled: index === 0, onclick: () => movePage(index, -1) }, '▲'),
          el('button', { class: 'icon', title: 'Move down', disabled: index === last, onclick: () => movePage(index, 1) }, '▼'),
          el('button', { class: 'icon', title: 'Duplicate', onclick: () => duplicatePage(index) }, 'Duplicate'),
          el('button', { class: 'icon danger', title: 'Delete page', disabled: last === 0, onclick: () => deletePage(index) }, 'Delete'),
        ),
        el('label', {}, 'Main sentence (shown in bold)'),
        el('textarea', { rows: 2, maxLength: 500, value: page.lead || '', placeholder: 'First, we…',
          oninput: (e) => { page.lead = e.target.value; setDirty(true); } }),
        el('label', {}, 'More detail'),
        el('textarea', { rows: 3, maxLength: 500, value: page.body || '',
          oninput: (e) => { page.body = e.target.value; setDirty(true); } }),
        el('div', { class: 'row', style: 'margin-top:10px' },
          el('button', { class: 'icon', onclick: () => addPage(index) }, '+ Add page after this'),
        ),
      ),
    );
  }

  function addPage(after) {
    const template = draft.pages[after];
    draft.pages.splice(after + 1, 0, { image: template.image, focus: template.focus ? clone(template.focus) : undefined, lead: '', body: '' });
    setDirty(true);
    renderPages();
  }

  function duplicatePage(index) {
    const copy = clone(draft.pages[index]);
    delete copy.id;
    draft.pages.splice(index + 1, 0, copy);
    setDirty(true);
    renderPages();
  }

  function deletePage(index) {
    if (draft.pages.length <= 1) return;
    if (!confirm('Delete page ' + (index + 1) + '?')) return;
    draft.pages.splice(index, 1);
    setDirty(true);
    renderPages();
  }

  function movePage(index, delta) {
    const [page] = draft.pages.splice(index, 1);
    draft.pages.splice(index + delta, 0, page);
    setDirty(true);
    renderPages();
  }

  function upload(page, done) {
    const input = $('file-input');
    input.value = '';
    input.onchange = async () => {
      const file = input.files[0];
      if (!file) return;
      try {
        const { path } = await api('POST', '/api/images', file, file.type || 'application/octet-stream');
        await loadImages();
        page.image = path;
        page.focus = undefined;
        setDirty(true);
        toast('Picture uploaded.');
        done();
      } catch (err) { toast(err.message, true); }
    };
    input.click();
  }

  // ── Save / delete ──────────────────────────────────────────────────────
  async function save() {
    const body = clone(draft);
    try {
      const saved = draftIsNew
        ? await api('POST', '/api/stories', body)
        : await api('PUT', '/api/stories/' + encodeURIComponent(draft.id), body);
      await loadStories();
      draft = clone(saved);
      draftIsNew = false;
      setDirty(false);
      renderEditor();
      renderList();
      toast('Saved. The app will show it the next time it loads stories.');
    } catch (err) { toast(err.message, true); }
  }

  function revert() {
    if (!confirmDiscard()) return;
    setDirty(false);
    if (draftIsNew) { draft = null; draftIsNew = false; renderEditor(); renderList(); }
    else openStory(draft.id);
  }

  async function deleteStory() {
    if (!confirm('Delete "' + draft.title + '" for everyone? This cannot be undone.')) return;
    try {
      await api('DELETE', '/api/stories/' + encodeURIComponent(draft.id));
      draft = null;
      setDirty(false);
      await loadStories();
      renderEditor();
      toast('Story deleted.');
    } catch (err) { toast(err.message, true); }
  }

  // ── Go ─────────────────────────────────────────────────────────────────
  if (token) start(); else showLogin();
})();
</script>
</body>
</html>
