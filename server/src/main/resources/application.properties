spring.application.name=social-stories-server

# Change these with environment variables (PORT, HOST, DATA_DIR, APP_DIR, ADMIN_TOKEN)
# or with --name=value on the command line.
server.port=${PORT:8080}
# 0.0.0.0 = reachable from phones on the same Wi-Fi
server.address=${HOST:0.0.0.0}

# Where stories, uploaded pictures and the admin token are saved.
stories.data-dir=${DATA_DIR:data}
# The Flutter app folder: the first start copies its assets/data/stories.json,
# and its assets/images/stories/ pictures can be used in stories.
stories.app-dir=${APP_DIR:..}
# Password for the admin page. Empty = generate one and save it in data/admin_token.txt.
stories.admin-token=${ADMIN_TOKEN:}

spring.main.banner-mode=off

# Google Play subscriptions. The server checks every purchase with Google.
# GOOGLE_PLAY_SERVICE_ACCOUNT = path to the service account's JSON key file
# (Play Console > Users and permissions; give it "View financial data").
# Empty = Play purchases can't be verified; admin-granted subscriptions still work.
stories.google-play.package-name=${GOOGLE_PLAY_PACKAGE:com.socialstories.social_stories}
stories.google-play.service-account-file=${GOOGLE_PLAY_SERVICE_ACCOUNT:}
